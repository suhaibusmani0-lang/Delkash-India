<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#CA8A04" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Luxury Navy Background with Gold Border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5" />

  <!-- Advocate Scales of Justice (Tarazu) -->
  <g filter="url(#goldGlow)">
    <!-- Top Finial Peak -->
    <path d="M32 7.5 L34.5 11 L29.5 11 Z" fill="url(#goldGrad)" />
    <circle cx="32" cy="12" r="2.2" fill="url(#goldGrad)" />

    <!-- Center Upright Column -->
    <rect x="30.5" y="13" width="3" height="40" rx="1.5" fill="url(#goldGrad)" />
    
    <!-- Heavy Weighted Base -->
    <rect x="23" y="52" width="18" height="3.5" rx="1.5" fill="url(#goldGrad)" />
    <rect x="26.5" y="49.5" width="11" height="2.5" rx="1" fill="url(#goldGrad)" />

    <!-- Balanced Crossbeam (Horizontal arm) -->
    <path d="M12 16.5 C12 15.5 16 14.5 32 14.5 C48 14.5 52 15.5 52 16.5 C52 17.5 48 18.5 32 18.5 C16 18.5 12 17.5 12 16.5 Z" fill="url(#goldGrad)" />
    
    <!-- Central Pivot Ring -->
    <circle cx="32" cy="16.5" r="4" fill="#070C18" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="32" cy="16.5" r="1.5" fill="url(#goldGrad)" />

    <!-- Left Scale (Tarazu ka Baayan Palda) -->
    <circle cx="15.5" cy="16.5" r="1.8" fill="url(#goldGrad)" />
    <line x1="15.5" y1="18" x2="7" y2="34" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" />
    <line x1="15.5" y1="18" x2="24" y2="34" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M6 34 Q15.5 43 25 34 Z" fill="url(#goldGrad)" />
    <ellipse cx="15.5" cy="34" rx="9.5" ry="2" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Right Scale (Tarazu ka Daayan Palda) -->
    <circle cx="48.5" cy="16.5" r="1.8" fill="url(#goldGrad)" />
    <line x1="48.5" y1="18" x2="40" y2="34" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" />
    <line x1="48.5" y1="18" x2="57" y2="34" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M39 34 Q48.5 43 58 34 Z" fill="url(#goldGrad)" />
    <ellipse cx="48.5" cy="34" rx="9.5" ry="2" fill="url(#goldGrad)" opacity="0.9" />
  </g>
</svg>

